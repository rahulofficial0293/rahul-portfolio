      <stop offset="0%" stop-color="#0f172a"></stop>
      <stop offset="50%" stop-color="#1f2937"></stop>
      <stop offset="100%" stop-color="#047857"></stop>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"></stop>
      <stop offset="100%" stop-color="#a855f7"></stop>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bgGradient)" rx="24"></rect>

  <!-- Accent circles -->
  <circle cx="1050" cy="60" r="80" fill="url(#accentGradient)" opacity="0.25"></circle>
  <circle cx="100" cy="260" r="120" fill="url(#accentGradient)" opacity="0.18"></circle>

  <!-- Main text -->
  <text x="80" y="120" fill="#e5e7eb" font-size="46" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700">
