<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Rahul | Lead Engineer Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Portfolio of Rahul, Lead Engineer specializing in Android, iOS, and React Native."
    />
    <style>
      :root {
        --bg: #020617;
        --bg-elevated: #020617;
        --bg-soft: #0b1120;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #22c55e;
        --accent-soft: rgba(34, 197, 94, 0.08);
        --border: #1e293b;
      }
      :root[data-theme='light'] {
        --bg: #f8fafc;
        --bg-elevated: #ffffff;
        --bg-soft: #e5e7eb;
        --text: #020617;
        --muted: #4b5563;
        --accent: #16a34a;
        --accent-soft: rgba(22, 163, 74, 0.08);
        --border: #d1d5db;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
          sans-serif;
        background: radial-gradient(circle at top, #1f2937 0, var(--bg) 55%);
        color: var(--text);
      }

      .app {
        min-height: 100vh;
        max-width: 1120px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 32px;
      }

      .logo {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      nav a {
        margin-left: 20px;
        font-size: 14px;
        text-decoration: none;
        color: var(--muted);
      }

      nav a:hover {
        color: var(--accent);
      }

      .theme-toggle {
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.4);
        padding: 4px 12px;
        font-size: 12px;
        color: var(--muted);
        cursor: pointer;
      }

      .theme-toggle span {
        font-size: 14px;
        margin-right: 6px;
      }

      .hero {
        display: grid;
        grid-template-columns: 3fr 2fr;
        gap: 24px;
        padding: 24px;
        background: linear-gradient(
            to bottom right,
            rgba(15, 23, 42, 0.9),
            rgba(15, 23, 42, 0.98)
          ),
          radial-gradient(circle at 0 0, rgba(56, 189, 248, 0.18), transparent),
          radial-gradient(
            circle at 100% 0,
            rgba(129, 140, 248, 0.18),
            transparent
          );
        border-radius: 24px;
        border: 1px solid rgba(148, 163, 184, 0.45);
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.8);
      }

      :root[data-theme='light'] .hero {
        background: radial-gradient(circle at 0 0, #e0f2fe, transparent),
          radial-gradient(circle at 100% 0, #e9d5ff, transparent),
          #ffffff;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.1);
      }

      .hero-title {
        font-size: 32px;
        font-weight: 700;
        margin-bottom: 8px;
      }

      .hero-subtitle {
        font-size: 16px;
        color: var(--muted);
        margin-bottom: 16px;
      }

      .hero-pill {
        display: inline-flex;
        align-items: center;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 12px;
        font-weight: 500;
        border: 1px solid rgba(34, 197, 94, 0.2);
        margin-bottom: 14px;
      }

      .hero-buttons {
        margin-top: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .btn-primary,
      .btn-ghost {
        border-radius: 999px;
        padding: 8px 18px;
        font-size: 14px;
        border: 1px solid var(--border);
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .btn-primary {
        background: var(--accent);
        color: #0f172a;
        border-color: transparent;
        font-weight: 600;
      }

      .btn-primary:hover {
        filter: brightness(1.05);
      }

      .btn-ghost {
        background: transparent;
        color: var(--text);
      }

      .btn-ghost:hover {
        background: rgba(15, 23, 42, 0.45);
      }

      :root[data-theme='light'] .btn-ghost:hover {
        background: rgba(15, 23, 42, 0.04);
      }

      .hero-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .tag {
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--muted);
      }

      .hero-right {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 12px;
      }

      .hero-card {
        padding: 14px 16px;
        border-radius: 16px;
        border: 1px solid rgba(148, 163, 184, 0.4);
        background: rgba(15, 23, 42, 0.9);
        font-size: 13px;
      }

      :root[data-theme='light'] .hero-card {
        background: #f9fafb;
      }

      .hero-card-title {
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 4px;
      }

      main {
        margin-top: 32px;
        display: grid;
        grid-template-columns: 2.2fr 1.4fr;
        gap: 24px;
      }

      section {
        margin-bottom: 24px;
      }

      .section-title {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 12px;
      }

      .card {
        background: var(--bg-soft);
        border-radius: 18px;
        padding: 18px 16px;
        border: 1px solid var(--border);
        margin-bottom: 12px;
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 4px;
      }

      .card-title {
        font-size: 14px;
        font-weight: 600;
      }

      .card-meta {
        font-size: 11px;
        color: var(--muted);
      }

      .card-tagline {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 4px;
      }

      .chip {
        font-size: 11px;
        padding: 3px 8px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid var(--border);
        color: var(--muted);
      }

      :root[data-theme='light'] .chip {
        background: #f3f4f6;
      }

      .skills-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .skill-category-title {
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 4px;
      }

      .skill-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .skill-badge {
        font-size: 11px;
        padding: 3px 8px;
        border-radius: 999px;
        border: 1px dashed var(--border);
        color: var(--muted);
      }

      .contact-card {
        padding: 16px;
        border-radius: 18px;
        border: 1px dashed var(--border);
        background: rgba(15, 23, 42, 0.6);
        font-size: 13px;
      }

      :root[data-theme='light'] .contact-card {
        background: #f9fafb;
      }

      .contact-item {
        margin-top: 8px;
        font-size: 13px;
      }

      .contact-item a {
        color: var(--accent);
        text-decoration: none;
      }

      footer {
        margin-top: 32px;
        font-size: 11px;
        color: var(--muted);
        text-align: center;
      }

      @media (max-width: 900px) {
        .hero {
          grid-template-columns: 1fr;
        }
        main {
          grid-template-columns: 1fr;
        }
        header {
          flex-direction: column;
          align-items: flex-start;
          gap: 12px;
        }
        nav {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- React & Babel via CDN -->
    <script
      src="https://unpkg.com/react@18/umd/react.development.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
      crossorigin
    ></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <script type="text/babel">
      const { useEffect, useState } = React;

      function useTheme() {
        const [theme, setTheme] = useState('dark');

        useEffect(() => {
          const stored =
            window.localStorage.getItem('rk-theme') ||
            (window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark');
          setTheme(stored);
          document.documentElement.setAttribute('data-theme', stored);
        }, []);

        const toggleTheme = () => {
          const next = theme === 'dark' ? 'light' : 'dark';
          setTheme(next);
          document.documentElement.setAttribute('data-theme', next);
          window.localStorage.setItem('rk-theme', next);
        };

        return [theme, toggleTheme];
      }

      const projects = [
        {
          name: 'Reemaq',
          period: 'May 2024 – Present',
          role: 'Lead Engineer',
          description:
            'End-to-end platform for vehicle inspections, fleet management and online auctions.',
          tech: ['React Native', 'TypeScript', 'Redux', 'Realm', 'REST APIs', 'CI/CD'],
        },
        {
          name: 'FROLO',
          period: 'Nov 2022 – Apr 2024',
          role: 'Lead Mobile Engineer',
          description:
            'Single-parent community app connecting like-minded parents for advice, support and friendship.',
          tech: ['React Native', 'TypeScript', 'Redux', 'Realm', 'REST APIs'],
        },
        {
          name: 'Payment Loyalty',
          period: 'Oct 2020 – Oct 2022',
          role: 'Senior Android Engineer',
          description:
            'Payment terminal solution enabling reward campaigns at the point of payment with PSP integration.',
          tech: ['Android', 'Kotlin', 'Coroutines', 'REST APIs', 'CI/CD'],
        },
        {
          name: 'Order Pay',
          period: 'Nov 2019 – Sep 2020',
          role: 'Android Engineer',
          description:
            'Restaurant ordering app that lets users place orders directly from their table.',
          tech: ['Android', 'Java', 'Bluetooth'],
        },
      ];

      const roles = [
        {
          title: 'Lead Engineer',
          company: 'Studio Graphene Pvt. Ltd.',
          location: 'Gurugram, India',
          period: 'Nov 2019 – Present',
          description:
            'Leading mobile and software engineering initiatives, owning architecture, technical strategy, and engineering quality.',
          highlights: [
            'Architect and ship scalable mobile applications across Android, iOS and React Native.',
            'Set coding standards, review code, and mentor engineers to raise code quality.',
            'Collaborate with product and design to deliver performant, user-centric experiences.',
          ],
        },
        {
          title: 'Sr. Android Developer',
          company: 'Molitics Infomedia Pvt. Ltd.',
          location: 'Gurugram, India',
          period: 'Mar 2017 – Nov 2019',
          description:
            'Spearheaded Android app development with focus on performance, crash reduction, and UX.',
          highlights: [
            'Implemented features with Agile practices using JIRA and CI/CD pipelines.',
            'Integrated RESTful APIs and third-party SDKs for rich, data-driven experiences.',
            'Optimized app performance and significantly reduced crash rates.',
          ],
        },
        {
          title: 'Android Developer',
          company: 'Xeine Tech Pvt. Ltd.',
          location: 'Gurugram, India',
          period: 'Mar 2016 – Mar 2017',
          description:
            'Delivered production-ready Android applications using Kotlin and Java.',
          highlights: [
            'Improved usability and functionality through iterative enhancements.',
            'Applied robust debugging to resolve critical issues and improve stability.',
          ],
        },
      ];

      function App() {
        const [theme, toggleTheme] = useTheme();

        return (
          <div className="app">
            <header>
              <div className="logo">RAHUL • LEAD ENGINEER</div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <nav>
                  <a href="#experience">Experience</a>
                  <a href="#projects">Projects</a>
                  <a href="#skills">Skills</a>
                  <a href="#contact">Contact</a>
                </nav>
                <button className="theme-toggle" onClick={toggleTheme}>
                  <span>{theme === 'dark' ? '🌙' : '☀️'}</span>
                  {theme === 'dark' ? 'Dark' : 'Light'} mode
                </button>
              </div>
            </header>

            <section className="hero">
              <div>
                <div className="hero-pill">
                  9.6+ years • Android · iOS · React Native
                </div>
                <h1 className="hero-title">Lead Engineer, Mobile & Software</h1>
                <p className="hero-subtitle">
                  I build scalable, high-quality mobile applications and lead engineering
                  teams to ship with confidence. From clean architecture and performance
                  tuning to CI/CD and API integration, I focus on doing the fundamentals
                  extremely well.
                </p>
                <div className="hero-buttons">
                  <a
                    className="btn-primary"
                    href="mailto:rahul.official0293@gmail.com"
                  >
                    📩 Get in touch
                  </a>
                  <a
                    className="btn-ghost"
                    href="https://www.linkedin.com/in/rahul-kathpalia-97681a136"
                    target="_blank"
                    rel="noreferrer"
                  >
                    🔗 LinkedIn
                  </a>
                  <a
                    className="btn-ghost"
                    href="https://github.com/rahulofficial0293"
                    target="_blank"
                    rel="noreferrer"
                  >
                    🧑‍💻 GitHub
                  </a>
                </div>
                <div className="hero-tags">
                  <span className="tag">Architecture & System Design</span>
                  <span className="tag">Team Leadership</span>
                  <span className="tag">UI/UX & Performance</span>
                  <span className="tag">Agile & CI/CD</span>
                </div>
              </div>

              <div className="hero-right">
                <div className="hero-card">
                  <div className="hero-card-title">Snapshot</div>
                  <div className="card-tagline">
                    • Lead Engineer @ Studio Graphene, Gurugram, India
                    <br />
                    • Experience across Android, iOS, React Native, TypeScript, Kotlin,
                    Java
                    <br />• Strong focus on scalable architecture and engineering
                    excellence
                  </div>
                </div>
                <div className="hero-card">
                  <div className="hero-card-title">Currently</div>
                  <div className="card-tagline">
                    Leading mobile engineering initiatives, mentoring developers, and
                    evolving architecture for multi-platform products.
                  </div>
                </div>
              </div>
            </section>

            <main>
              <div>
                <section id="experience">
                  <h2 className="section-title">Experience</h2>
                  {roles.map((role) => (
                    <article key={role.title} className="card">
                      <div className="card-header">
                        <div className="card-title">
                          {role.title} · {role.company}
                        </div>
                        <div className="card-meta">{role.period}</div>
                      </div>
                      <div className="card-meta">{role.location}</div>
                      <p className="card-tagline">{role.description}</p>
                      <ul style={{ paddingLeft: 18, fontSize: 12, color: 'var(--muted)' }}>
                        {role.highlights.map((h) => (
                          <li key={h}>{h}</li>
                        ))}
                      </ul>
                    </article>
                  ))}
                </section>

                <section id="projects">
                  <h2 className="section-title">Selected Projects</h2>
                  {projects.map((project) => (
                    <article key={project.name} className="card">
                      <div className="card-header">
                        <div className="card-title">{project.name}</div>
                        <div className="card-meta">{project.period}</div>
                      </div>
                      <div className="card-meta">{project.role}</div>
                      <p className="card-tagline">{project.description}</p>
                      <div className="chip-row">
                        {project.tech.map((t) => (
                          <span key={t} className="chip">
                            {t}
                          </span>
                        ))}
                      </div>
                    </article>
                  ))}
                </section>
              </div>

              <div>
                <section id="skills">
                  <h2 className="section-title">Skills</h2>
                  <div className="card">
                    <div className="skills-grid">
                      <div>
                        <div className="skill-category-title">Mobile & Frontend</div>
                        <div className="skill-badges">
                          <span className="skill-badge">React Native</span>
                          <span className="skill-badge">Android (Kotlin/Java)</span>
                          <span className="skill-badge">iOS</span>
                          <span className="skill-badge">TypeScript</span>
                          <span className="skill-badge">JavaScript</span>
                        </div>
                      </div>
                      <div>
                        <div className="skill-category-title">Architecture</div>
                        <div className="skill-badges">
                          <span className="skill-badge">MVP</span>
                          <span className="skill-badge">MVVM</span>
                          <span className="skill-badge">SOLID</span>
                          <span className="skill-badge">Design Patterns</span>
                        </div>
                      </div>
                      <div>
                        <div className="skill-category-title">Engineering</div>
                        <div className="skill-badges">
                          <span className="skill-badge">CI/CD</span>
                          <span className="skill-badge">REST APIs</span>
                          <span className="skill-badge">Debugging & Performance</span>
                          <span className="skill-badge">Code Reviews</span>
                        </div>
                      </div>
                      <div>
                        <div className="skill-category-title">Ways of Working</div>
                        <div className="skill-badges">
                          <span className="skill-badge">Agile</span>
                          <span className="skill-badge">Scrum</span>
                          <span className="skill-badge">Mentoring</span>
                          <span className="skill-badge">Stakeholder Collaboration</span>
                        </div>
                      </div>
                    </div>
                  </div>
                </section>

                <section id="contact">
                  <h2 className="section-title">Contact</h2>
                  <div className="contact-card">
                    <div>Interested in working together or just saying hi?</div>
                    <div className="contact-item">
                      ✉️ Email:{' '}
                      <a href="mailto:rahul.official0293@gmail.com">
                        rahul.official0293@gmail.com
                      </a>
                    </div>
                    <div className="contact-item">
                      🔗 LinkedIn:{' '}
                      <a
                        href="https://www.linkedin.com/in/rahul-kathpalia-97681a136"
                        target="_blank"
                        rel="noreferrer"
                      >
                        Rahul Kathpalia
                      </a>
                    </div>
                    <div className="contact-item">
                      🧑‍💻 GitHub:{' '}
                      <a
                        href="https://github.com/rahulofficial0293"
                        target="_blank"
                        rel="noreferrer"
                      >
                        github.com/rahulofficial0293
                      </a>
                    </div>
                  </div>
                </section>

                <section>
                  <h2 className="section-title">Education</h2>
                  <div className="card">
                    <div className="skill-category-title">Master of Business Administration</div>
                    <div className="card-meta">SVSU</div>
                    <div className="skill-category-title" style={{ marginTop: 10 }}>
                      Bachelor of Computer Applications
                    </div>
                    <div className="card-meta">IGNOU</div>
                    <div className="skill-category-title" style={{ marginTop: 10 }}>
                      Senior Secondary
                    </div>
                    <div className="card-meta">NIOS</div>
                  </div>

              </div>
            </main>

            <footer>
              © {new Date().getFullYear()} Rahul · Built with React · Hosted on GitHub
              Pages
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>

          const stored =
            window.localStorage.getItem('rk-theme') ||
            (window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark');
          setTheme(stored);
          document.documentElement.setAttribute('data-theme', stored);
        }, []);

        const toggleTheme = () => {
          const next = theme === 'dark' ? 'light' : 'dark';
          setTheme(next);
          document.documentElement.setAttribute('data-theme', next);
          window.localStorage.setItem('rk-theme', next);
        };

        return [theme, toggleTheme];
